name: AGW SDK validation (unfunded)
on:
  pull_request:
    paths:
      [
        'packages/core/**',
        'tsconfig.base.json',
        'yarn.lock',
        '.github/workflows/agw-sdk-validation.yml',
      ]
  workflow_dispatch:
    inputs:
      contracts:
        description: 'Run contract suites and full API checks (slower)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: agw-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      YARN_ENABLE_HARDENED_MODE: '1'
      AGW_REPO: ${{ github.workspace }}/.ci-contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch' && inputs.contracts
        with:
          repository: pushchain/push-agentic-wallets
          ref: ffd567d3e49b2d27c6f50ad36093274dbac3090f
          path: .ci-contracts
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: foundry-rs/foundry-toolchain@v1
        if: github.event_name == 'workflow_dispatch' && inputs.contracts
        with:
          version: v1.5.1
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - name: SDK tests, types, build and package checks
        if: github.event_name != 'workflow_dispatch' || !inputs.contracts
        run: node packages/core/scripts/agw-verify.js --sdk-only
      - name: Full unfunded contract and SDK checks
        if: github.event_name == 'workflow_dispatch' && inputs.contracts
        env:
          AGW_LOCAL_DIR: ${{ runner.temp }}/agw-v6-build
          AGW_ALLOW_COMPILER_DOWNLOAD: '1'
        run: node packages/core/scripts/agw-verify.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agw-unfunded-validation
          path: .agw-validation/
          include-hidden-files: true
          if-no-files-found: ignore
